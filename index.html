<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>금수저 윤이님의 그지병원 탐험기</title>

<!-- PWA: 설치형 앱(홈화면 추가 / PWABuilder)용 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="심장내과 비서">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f6e6e'/%3E%3Cpath d='M40 100h26l10-26 18 52 14-34 8 16h36' fill='none' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%EC%8B%AC%EC%9E%A5%EB%82%B4%EA%B3%BC%20%EB%B9%84%EC%84%9C%22%2C%22short_name%22%3A%22%EC%8B%AC%EC%9E%A5%EB%82%B4%EA%B3%BC%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1419%22%2C%22theme_color%22%3A%22%230f6e6e%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2527%2520viewBox%253D%25270%25200%2520192%2520192%2527%253E%253Crect%2520width%253D%2527192%2527%2520height%253D%2527192%2527%2520rx%253D%252742%2527%2520fill%253D%2527%25230f6e6e%2527%252F%253E%253Cpath%2520d%253D%2527M40%2520100h26l10-26%252018%252052%252014-34%25208%252016h36%2527%2520fill%253D%2527none%2527%2520stroke%253D%2527white%2527%2520stroke-width%253D%25279%2527%2520stroke-linecap%253D%2527round%2527%2520stroke-linejoin%253D%2527round%2527%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%22%7D%5D%7D">
<style>
  :root {
    --bg:#f4f5f3; --surface:#fff; --surface-2:#ecedea; --ink:#1b1f24; --ink-soft:#5c636d;
    --line:#dcddd8; --accent:#0f6e6e; --accent-soft:#e3f0ef;
    --emergency:#c0392b; --emergency-soft:#fbe9e7; --round:#1f6feb; --round-soft:#e7f0fd;
    --admin:#9a7b16; --admin-soft:#fbf3df; --oncall:#d35400; --oncall-soft:#fdebd8;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05); --radius:16px;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0f1419;--surface:#1a2027;--surface-2:#232b34;--ink:#e8eaed;--ink-soft:#9aa3ad;--line:#2c343d;
    --accent:#2dd4bf;--accent-soft:#143331;--emergency:#ff6b5e;--emergency-soft:#3a1f1d;
    --round:#6ba8ff;--round-soft:#1a2840;--admin:#e8c45a;--admin-soft:#332b14;
    --oncall:#ff9d4d;--oncall-soft:#3a2613;--shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  html[data-theme="dark"]{--bg:#0f1419;--surface:#1a2027;--surface-2:#232b34;--ink:#e8eaed;--ink-soft:#9aa3ad;--line:#2c343d;--accent:#2dd4bf;--accent-soft:#143331;--emergency:#ff6b5e;--emergency-soft:#3a1f1d;--round:#6ba8ff;--round-soft:#1a2840;--admin:#e8c45a;--admin-soft:#332b14;--oncall:#ff9d4d;--oncall-soft:#3a2613;--shadow:0 1px 3px rgba(0,0,0,.4);}
  html[data-theme="light"]{--bg:#f4f5f3;--surface:#fff;--surface-2:#ecedea;--ink:#1b1f24;--ink-soft:#5c636d;--line:#dcddd8;--accent:#0f6e6e;--accent-soft:#e3f0ef;--emergency:#c0392b;--emergency-soft:#fbe9e7;--round:#1f6feb;--round-soft:#e7f0fd;--admin:#9a7b16;--admin-soft:#fbf3df;--oncall:#d35400;--oncall-soft:#fdebd8;--shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(140px + var(--safe-bottom));}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(12px);padding:14px 0 10px;border-bottom:1px solid var(--line);}
  .head-row{display:flex;align-items:center;justify-content:space-between;}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px;}
  h1 .sub{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.5px;margin-top:1px;}
  .head-btns{display:flex;gap:6px;}
  .icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);
    border-radius:11px;font-size:16px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .icon-btn:active{transform:scale(.94);}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .stat{display:flex;gap:10px;padding:10px 0 4px;font-size:12px;color:var(--ink-soft);}
  .stat b{color:var(--ink);}

  /* 검색창 (연락처) */
  .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--ink);font-size:15px;margin-top:10px;font-family:inherit;}

  .list{display:flex;flex-direction:column;gap:9px;padding-top:6px;}

  /* 할 일 카드 */
  .task{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    border-left:5px solid var(--line);padding:13px 14px;display:flex;gap:11px;align-items:flex-start;transition:opacity .2s;}
  .task.cat-EMERGENCY{border-left-color:var(--emergency);}
  .task.cat-ROUND{border-left-color:var(--round);}
  .task.cat-ADMIN{border-left-color:var(--admin);}
  .task.done{opacity:.5;} .task.done .t-title{text-decoration:line-through;}
  .check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
    background:transparent;cursor:pointer;margin-top:1px;position:relative;}
  .task.done .check{background:var(--accent);border-color:var(--accent);}
  .task.done .check::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;}
  .t-body{flex:1;min-width:0;}
  .t-title{font-size:15px;font-weight:600;word-break:break-word;}
  .t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);}
  .tag.cat-EMERGENCY{background:var(--emergency-soft);color:var(--emergency);}
  .tag.cat-ROUND{background:var(--round-soft);color:var(--round);}
  .tag.cat-ADMIN{background:var(--admin-soft);color:var(--admin);}
  .tag.proc{background:var(--accent-soft);color:var(--accent);}
  .t-del{flex:0 0 auto;background:none;border:none;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:2px 4px;line-height:1;}

  /* 연락처 카드 */
  .contact{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:13px 14px;display:flex;gap:12px;align-items:center;}
  .contact.oncall{border:1.5px solid var(--oncall);}
  .avatar{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .contact.oncall .avatar{background:var(--oncall-soft);color:var(--oncall);}
  .c-body{flex:1;min-width:0;}
  .c-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .oncall-badge{font-size:10px;font-weight:700;color:#fff;background:var(--oncall);padding:2px 7px;border-radius:6px;}
  .c-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .c-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;}
  .c-tag.DEPT{background:var(--round-soft);color:var(--round);}
  .c-tag.ROLE{background:var(--accent-soft);color:var(--accent);}
  .c-tag.SITE{background:var(--admin-soft);color:var(--admin);}
  .c-nums{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .c-actions{flex:0 0 auto;display:flex;gap:7px;}
  .call-btn{width:42px;height:42px;border-radius:50%;border:none;display:flex;align-items:center;
    justify-content:center;font-size:18px;cursor:pointer;text-decoration:none;}
  .call-ext{background:var(--accent-soft);color:var(--accent);}
  .call-per{background:var(--round-soft);color:var(--round);}
  .call-vcf{background:var(--admin-soft);color:var(--admin);}
  .call-btn:active{transform:scale(.9);}

  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:14px;}
  .empty .big{font-size:34px;margin-bottom:8px;}

  /* FAB */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-bottom));z-index:20;
    background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 28px;font-size:16px;
    font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(15,110,110,.4);display:flex;align-items:center;gap:7px;}
  .fab:active{transform:translateX(-50%) scale(.96);}

  /* 하단 탭 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);
    border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;
    padding-bottom:var(--safe-bottom);}
  .tabbar button{flex:1;background:none;border:none;padding:11px 0 9px;cursor:pointer;color:var(--ink-soft);
    font-size:10.5px;font-weight:600;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tabbar button .ic{font-size:21px;}
  .tabbar button.active{color:var(--accent);}

  /* 시트 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;}
  .sheet-bg.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;
    padding:8px 18px calc(22px + var(--safe-bottom));max-width:560px;margin:0 auto;
    transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.8,.3,1);max-height:90vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .grab{width:40px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 14px;}
  .sheet h2{font-size:16px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:13px 0 6px;}
  input[type=text],input[type=tel],input[type=datetime-local],select,textarea{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
    background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit;}
  textarea{resize:vertical;min-height:54px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:11px 4px;border:1px solid var(--line);background:var(--bg);border-radius:11px;
    font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .seg button.sel-EMERGENCY{background:var(--emergency-soft);color:var(--emergency);border-color:var(--emergency);}
  .seg button.sel-ROUND{background:var(--round-soft);color:var(--round);border-color:var(--round);}
  .seg button.sel-ADMIN{background:var(--admin-soft);color:var(--admin);border-color:var(--admin);}
  .row2{display:flex;gap:9px;} .row2>div{flex:1;}
  .save-btn{width:100%;margin-top:20px;padding:15px;background:var(--accent);color:#fff;border:none;
    border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;}
  .save-btn:active{transform:scale(.98);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
    padding:13px;background:var(--oncall-soft);border-radius:12px;}
  .switch-row span{font-size:14px;font-weight:700;color:var(--oncall);}
  .toggle{width:50px;height:30px;border-radius:99px;background:var(--line);border:none;position:relative;cursor:pointer;transition:background .2s;}
  .toggle.on{background:var(--oncall);}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;}
  .toggle.on::after{transform:translateX(20px);}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:5px;}

  /* 태그 입력 */
  .tag-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .tag-pick{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;}
  .tag-pick.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tag-add{display:flex;gap:6px;margin-top:8px;}
  .tag-add input{flex:1;}
  .tag-add button{padding:0 16px;border:1px solid var(--accent);background:var(--accent-soft);
    color:var(--accent);border-radius:11px;font-weight:700;cursor:pointer;font-size:14px;}

  .menu{position:fixed;top:62px;right:16px;z-index:40;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;min-width:200px;}
  .menu.open{display:block;}
  .menu button{width:100%;text-align:left;padding:11px 12px;border:none;background:none;color:var(--ink);
    font-size:14px;cursor:pointer;border-radius:9px;font-family:inherit;}
  .menu button:active{background:var(--surface-2);}
  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
    z-index:50;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}

  /* 응급실 현황 */
  #erPanel{padding-top:8px;}
  .er-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  .er-name{font-size:17px;font-weight:700;}
  .er-time{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .er-beds{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
  .bed{background:var(--bg);border-radius:12px;padding:11px 13px;border:1px solid var(--line);}
  .bed .lbl{font-size:12px;color:var(--ink-soft);}
  .bed .val{font-size:24px;font-weight:800;margin-top:2px;}
  .bed.full .val{color:var(--emergency);}
  .bed.ok .val{color:var(--accent);}
  .sec-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin:18px 4px 8px;letter-spacing:.3px;}
  .accept{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface);
    border-radius:12px;box-shadow:var(--shadow);margin-bottom:7px;}
  .accept .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .accept.yes .dot{background:var(--accent);}
  .accept.no .dot{background:var(--emergency);}
  .accept .a-lbl{flex:1;font-size:14px;font-weight:600;}
  .accept .a-st{font-size:12px;font-weight:700;}
  .accept.yes .a-st{color:var(--accent);}
  .accept.no .a-st{color:var(--emergency);}
  .er-msg{background:var(--emergency-soft);color:var(--emergency);border-radius:12px;padding:12px 14px;
    font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.5;}
  .er-refresh{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:13px;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
  .er-refresh:active{transform:scale(.98);}
  .er-refresh:disabled{opacity:.6;}
  .er-state{text-align:center;color:var(--ink-soft);padding:36px 20px;font-size:14px;line-height:1.6;}
  .er-state .big{font-size:34px;margin-bottom:10px;}
  .er-setup{background:var(--admin-soft);color:var(--admin);border-radius:12px;padding:13px;font-size:13px;
    line-height:1.6;margin-bottom:12px;}
  .er-cached{font-size:12px;color:var(--admin);background:var(--admin-soft);padding:7px 12px;border-radius:9px;
    text-align:center;margin-bottom:10px;font-weight:600;}

  /* 자료함 */
  #vaultPanel{padding-top:8px;}
  .v-search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--ink);font-size:15px;margin-bottom:12px;font-family:inherit;}
  .v-item{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:12px;}
  .v-thumb{width:100%;display:block;background:var(--surface-2);cursor:pointer;}
  .v-info{padding:11px 13px;}
  .v-title{font-size:14px;font-weight:700;word-break:break-word;}
  .v-date{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .v-text{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.5;max-height:60px;overflow:hidden;
    background:var(--bg);border-radius:8px;padding:7px 9px;white-space:pre-wrap;word-break:break-word;}
  .v-text.expanded{max-height:none;}
  .v-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
  .v-btn{flex:1;min-width:70px;padding:9px 6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .v-btn.ocr{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .v-btn.share{border-color:var(--round);color:var(--round);background:var(--round-soft);}
  .v-btn.del{border-color:var(--emergency);color:var(--emergency);}
  .v-btn:active{transform:scale(.96);}
  .v-btn:disabled{opacity:.55;}
  .v-empty{text-align:center;color:var(--ink-soft);padding:46px 20px;font-size:14px;line-height:1.6;}
  .v-empty .big{font-size:34px;margin-bottom:10px;}
  .v-note{font-size:11px;color:var(--admin);background:var(--admin-soft);padding:10px 12px;border-radius:10px;
    margin-bottom:12px;line-height:1.55;}
  /* 이미지 확대 보기 */
  .v-viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;
    align-items:center;justify-content:center;flex-direction:column;}
  .v-viewer.open{display:flex;}
  .v-viewer img{max-width:100%;max-height:82vh;object-fit:contain;}
  .v-viewer .close{position:absolute;top:calc(14px + var(--safe-bottom));right:18px;color:#fff;font-size:30px;
    background:none;border:none;cursor:pointer;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head-row">
        <h1 id="pageTitle">금수저 윤이님의 그지병원 탐험기<span class="sub" id="pageSub">CARDIOLOGY · TO-DO</span></h1>
        <div class="head-btns">
          <button class="icon-btn" id="themeBtn" title="다크모드">🌓</button>
          <button class="icon-btn" id="menuBtn" title="설정">⋯</button>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <input type="text" class="search hidden" id="search" placeholder="🔍 이름·태그·번호 검색">
    </header>

    <div class="stat" id="stat"></div>
    <div class="list" id="list"></div>

    <!-- 응급실 현황 패널 -->
    <div id="erPanel" class="hidden">
      <div id="erContent"></div>
    </div>

    <!-- 자료함 패널 -->
    <div id="vaultPanel" class="hidden">
      <div id="vaultList"></div>
    </div>
    <input type="file" id="vaultInput" accept="image/*" hidden>
  </div>

  <button class="fab" id="fab">＋ 추가</button>

  <!-- 하단 탭 -->
  <nav class="tabbar">
    <button data-tab="todo" class="active"><span class="ic">✓</span>할 일</button>
    <button data-tab="contacts"><span class="ic">👥</span>연락처</button>
    <button data-tab="vault"><span class="ic">🗂️</span>자료함</button>
    <button data-tab="er"><span class="ic">🚑</span>응급실</button>
  </nav>

  <!-- 설정 메뉴 -->
  <div class="menu" id="menu">
    <button id="exportBtn">⬇ 전체 백업 내보내기</button>
    <button id="importBtn">⬆ 백업 불러오기</button>
    <button id="clearOncall">🔄 당직표시 모두 끄기</button>
    <button id="clearDone">🧹 완료한 할 일 비우기</button>
    <input type="file" id="fileInput" accept="application/json" hidden>
  </div>

  <!-- 할 일 입력 시트 -->
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="taskSheet">
    <div class="grab"></div>
    <h2 id="taskSheetTitle">새 할 일</h2>
    <label>내용</label>
    <input type="text" id="f-title" placeholder="예: 301호 CAG 결과 확인" autocomplete="off">
    <label>분류 (우선순위)</label>
    <div class="seg" id="f-cat">
      <button data-v="EMERGENCY">응급</button>
      <button data-v="ROUND">회진</button>
      <button data-v="ADMIN">행정</button>
    </div>
    <div class="row2">
      <div><label>위치</label>
        <select id="f-loc"><option value="WARD">병동</option><option value="CCU">CCU</option>
          <option value="CATH">심도자실</option><option value="OPD">외래</option><option value="ETC">기타</option></select></div>
      <div><label>시술/검사</label>
        <select id="f-proc"><option value="">없음</option><option value="CAG">CAG</option><option value="PCI">PCI</option>
          <option value="ECHO">Echo</option><option value="CCTA">CCTA</option><option value="EP">EP</option></select></div>
    </div>
    <label>마감 시간 (선택)</label>
    <input type="datetime-local" id="f-due">
    <label>메모 (선택 · 환자 식별정보는 피하세요)</label>
    <textarea id="f-notes" placeholder="예: C-12 bed, 결과 확인 후 협진 회신"></textarea>
    <button class="save-btn" id="saveTaskBtn">저장</button>
  </div>

  <!-- 연락처 입력 시트 -->
  <div class="sheet" id="contactSheet">
    <div class="grab"></div>
    <h2 id="contactSheetTitle">새 연락처</h2>
    <label>이름</label>
    <input type="text" id="c-name" placeholder="예: 김OO" autocomplete="off">
    <div class="row2">
      <div><label>원내 내선</label><input type="tel" id="c-ext" placeholder="예: 1234" autocomplete="off"></div>
      <div><label>개인 번호</label><input type="tel" id="c-per" placeholder="예: 010-0000-0000" autocomplete="off"></div>
    </div>
    <label>분류 태그 (여러 개 선택 가능)</label>
    <div class="tag-pool" id="tagPool"></div>
    <div class="tag-add">
      <input type="text" id="newTag" placeholder="새 태그 추가 (예: 심장내과, 전임의, 심도자실)">
      <button id="addTagBtn">추가</button>
    </div>
    <div class="hint">부서·직종·근무지 등 원하는 만큼 붙일 수 있습니다.</div>
    <div class="switch-row">
      <span>🔥 오늘의 당직</span>
      <button class="toggle" id="c-oncall"></button>
    </div>
    <label>메모 (선택)</label>
    <textarea id="c-memo" placeholder="예: 야간 콜 우선, 협진 빠름"></textarea>
    <button class="save-btn" id="saveContactBtn">저장</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 이미지 확대 보기 -->
  <div class="v-viewer" id="vViewer">
    <button class="close" id="vClose">✕</button>
    <img id="vViewerImg" alt="">
  </div>

<script>
// ── PWA 서비스워커 (오프라인 캐싱) ──
// 외부 파일 없이 인라인으로 등록 → 음영지역에서도 앱이 켜짐. PWABuilder도 인식.
if("serviceWorker" in navigator && location.protocol==="https:"){
  const swCode = `
    const C="cardio-v1";
    self.addEventListener("install",e=>{self.skipWaiting();});
    self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim());});
    self.addEventListener("fetch",e=>{
      const u=e.request.url;
      // E-Gen/프록시 요청은 캐시하지 않고 항상 네트워크
      if(u.includes("data.go.kr")||u.includes("allorigins")||u.includes("corsproxy")||u.includes("thingproxy")){return;}
      e.respondWith(
        caches.open(C).then(c=>c.match(e.request).then(r=>{
          const f=fetch(e.request).then(res=>{ if(res&&res.status===200&&e.request.method==="GET"){c.put(e.request,res.clone());} return res; }).catch(()=>r);
          return r||f;
        }))
      );
    });`;
  try{
    const blob=new Blob([swCode],{type:"text/javascript"});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}
</script>
<script>
(function(){
  "use strict";
  const KEY="cardioApp.v2", $=(id)=>document.getElementById(id);

  // ── 데이터 ──
  let data = { tasks:[], contacts:[], tagList:["교수","전임의","PA/기사/간호사","외래","Q"] };
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s) data={...data,...s}; }catch(e){}
  // 구버전(할 일만) 데이터 이전
  try{ const old=JSON.parse(localStorage.getItem("cardioTodo.v1")); if(old&&old.length&&!data.tasks.length){data.tasks=old;} }catch(e){}
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast("저장 실패");} }
  // 기본 태그 보정: 새 태그 추가 + 옛 태그 정리
  ["교수","전임의","PA/기사/간호사","외래","Q"].forEach(t=>{ if(!data.tagList.includes(t)) data.tagList.push(t); });
  // 분리돼 있던 기사/간호사/PA 를 쓰던 연락처는 합친 태그로 이전
  data.contacts.forEach(c=>{
    if(!Array.isArray(c.tags)) return;
    const had = c.tags.some(x=>["기사","간호사","PA"].includes(x));
    c.tags = c.tags.filter(x=>!["기사","간호사","PA"].includes(x));
    if(had && !c.tags.includes("PA/기사/간호사")) c.tags.push("PA/기사/간호사");
  });
  // 더 이상 쓰지 않는 옛 태그를 목록에서 제거
  ["심장내과","심도자실","CCU","당직","기사","간호사","PA"].forEach(t=>{
    const usedByContact = data.contacts.some(c=>(c.tags||[]).includes(t));
    if(!usedByContact) data.tagList = data.tagList.filter(x=>x!==t);
  });
  save();

  const LOC={WARD:"병동",CCU:"CCU",CATH:"심도자실",OPD:"외래",ETC:"기타"};
  const CAT={EMERGENCY:"응급",ROUND:"회진",ADMIN:"행정"};
  const RANK={EMERGENCY:0,ROUND:1,ADMIN:2};

  let tab="todo", taskFilter="ALL", contactFilter="ALL", searchQ="";
  let editTask=null, editContact=null, selCat="ROUND", pickedTags=[], oncallOn=false;

  // ════ 탭 전환 ════
  document.querySelectorAll(".tabbar button").forEach(b=>{
    b.onclick=()=>{ tab=b.dataset.tab;
      document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("active",x===b));
      const isER = tab==="er", isVault = tab==="vault";
      const isPanel = isER || isVault;   // 별도 패널 탭(공통 목록/통계 숨김)
      // 패널/공통영역 표시 전환
      $("erPanel").classList.toggle("hidden", !isER);
      $("vaultPanel").classList.toggle("hidden", !isVault);
      $("list").classList.toggle("hidden", isPanel);
      $("stat").classList.toggle("hidden", isPanel);
      $("filters").classList.toggle("hidden", isPanel);
      $("fab").classList.toggle("hidden", isER);   // 응급실 탭엔 추가버튼 없음
      $("search").classList.add("hidden");

      if(tab==="todo"){ $("pageTitle").childNodes[0].nodeValue="금수저 윤이님의 그지병원 탐험기";
        $("pageSub").textContent="CARDIOLOGY · TO-DO"; $("fab").innerHTML="＋ 할 일"; }
      else if(tab==="contacts"){ $("pageTitle").childNodes[0].nodeValue="연락처";
        $("pageSub").textContent="CONTACTS"; $("search").classList.remove("hidden"); $("fab").innerHTML="＋ 연락처"; }
      else if(tab==="vault"){ $("pageTitle").childNodes[0].nodeValue="자료함";
        $("pageSub").textContent="공문서 · 캡처 보관"; $("fab").innerHTML="＋ 자료"; }
      else { $("pageTitle").childNodes[0].nodeValue="신촌세브란스 응급실 현황";
        $("pageSub").textContent="신촌세브란스 · E-GEN"; }

      if(isER){ renderER(); }
      else if(isVault){ renderVault(); }
      else { renderFilters(); render(); }
    };
  });

  // ════ 필터 칩 ════
  function renderFilters(){
    let chips;
    if(tab==="todo"){
      const locs=["ALL","WARD","CCU","CATH","OPD","ETC"];
      chips=locs.map(l=>({v:l,label:l==="ALL"?"전체":LOC[l],active:taskFilter===l}));
    } else {
      const tags=["ALL","당직",...data.tagList.filter(t=>t!=="당직")];
      chips=tags.map(t=>({v:t,label:t==="ALL"?"전체":(t==="당직"?"🔥 당직":t),active:contactFilter===t}));
    }
    $("filters").innerHTML=chips.map(c=>`<button class="chip ${c.active?'active':''}" data-v="${c.v}">${c.label}</button>`).join("");
    $("filters").querySelectorAll(".chip").forEach(c=>{
      c.onclick=()=>{ if(tab==="todo")taskFilter=c.dataset.v; else contactFilter=c.dataset.v; renderFilters(); render(); };
    });
  }

  // ════ 렌더 ════
  function render(){ tab==="todo"?renderTasks():renderContacts(); }

  function renderTasks(){
    let items=data.tasks.filter(t=>taskFilter==="ALL"||t.loc===taskFilter);
    items.sort((a,b)=>(a.done-b.done)||(RANK[a.cat]-RANK[b.cat])||((a.due||"9")>(b.due||"9")?1:-1));
    const all=data.tasks.length,done=data.tasks.filter(t=>t.done).length,
          urgent=data.tasks.filter(t=>!t.done&&t.cat==="EMERGENCY").length;
    $("stat").innerHTML=`<span>전체 <b>${all}</b></span><span>응급 <b style="color:var(--emergency)">${urgent}</b></span><span>완료 <b>${done}</b></span>`;
    if(!items.length){ $("list").innerHTML=`<div class="empty"><div class="big">🩺</div>할 일이 없습니다.<br>아래 버튼으로 추가하세요.</div>`; return; }
    $("list").innerHTML=items.map(t=>{
      const due=t.due?`<span class="tag">⏰ ${fmtDue(t.due)}</span>`:"";
      const proc=t.proc?`<span class="tag proc">${t.proc}</span>`:"";
      const notes=t.notes?`<span class="tag">📝</span>`:"";
      return `<div class="task cat-${t.cat} ${t.done?'done':''}" data-id="${t.id}">
        <button class="check" data-act="toggle"></button>
        <div class="t-body"><div class="t-title">${esc(t.title)}</div>
          <div class="t-meta"><span class="tag cat-${t.cat}">${CAT[t.cat]}</span>
            <span class="tag">${LOC[t.loc]}</span>${proc}${due}${notes}</div></div>
        <button class="t-del" data-act="del">✕</button></div>`;
    }).join("");
    $("list").querySelectorAll(".task").forEach(el=>{const id=el.dataset.id;
      el.querySelector('[data-act="toggle"]').onclick=()=>{const t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render();}};
      el.querySelector('[data-act="del"]').onclick=()=>{if(confirm("삭제할까요?")){data.tasks=data.tasks.filter(x=>x.id!==id);save();render();}};
      el.querySelector('.t-body').onclick=()=>openTaskSheet(id);
    });
  }

  function renderContacts(){
    let items=data.contacts.slice();
    if(contactFilter==="당직") items=items.filter(c=>c.oncall);
    else if(contactFilter!=="ALL") items=items.filter(c=>(c.tags||[]).includes(contactFilter));
    if(searchQ){ const q=searchQ.toLowerCase();
      items=items.filter(c=>(c.name||"").toLowerCase().includes(q)||
        (c.tags||[]).join(" ").toLowerCase().includes(q)||
        (c.ext||"").includes(q)||(c.per||"").includes(q)); }
    // 당직자 최상단 → 이름순
    items.sort((a,b)=>(Number(b.oncall)-Number(a.oncall))||(a.name||"").localeCompare(b.name||"","ko"));
    const total=data.contacts.length, onc=data.contacts.filter(c=>c.oncall).length;
    $("stat").innerHTML=`<span>전체 <b>${total}</b></span><span>오늘 당직 <b style="color:var(--oncall)">${onc}</b></span>`;
    if(!items.length){ $("list").innerHTML=`<div class="empty"><div class="big">👥</div>연락처가 없습니다.<br>아래 버튼으로 추가하세요.</div>`; return; }
    $("list").innerHTML=items.map(c=>{
      const initial=(c.name||"?").trim().charAt(0);
      const tags=(c.tags||[]).map(t=>`<span class="c-tag ROLE">${esc(t)}</span>`).join("");
      const nums=[]; if(c.ext)nums.push("내선 "+esc(c.ext)); if(c.per)nums.push(esc(c.per));
      const extBtn=c.ext?`<a class="call-btn call-ext" href="tel:${encodeURIComponent(c.ext)}" title="내선">☎</a>`:"";
      const perBtn=c.per?`<a class="call-btn call-per" href="tel:${encodeURIComponent(c.per)}" title="휴대폰">📱</a>`:"";
      const vcfBtn=`<button class="call-btn call-vcf" data-act="vcf" title="폰에 저장">📇</button>`;
      return `<div class="contact ${c.oncall?'oncall':''}" data-id="${c.id}">
        <div class="avatar">${esc(initial)}</div>
        <div class="c-body" data-act="edit">
          <div class="c-name">${esc(c.name)}${c.oncall?'<span class="oncall-badge">당직</span>':''}</div>
          ${tags?`<div class="c-tags">${tags}</div>`:''}
          ${nums.length?`<div class="c-nums">${nums.join(" · ")}</div>`:''}
        </div>
        <div class="c-actions">${extBtn}${perBtn}${vcfBtn}</div></div>`;
    }).join("");
    $("list").querySelectorAll(".contact").forEach(el=>{
      el.querySelector('[data-act="edit"]').onclick=()=>openContactSheet(el.dataset.id);
      el.querySelector('[data-act="vcf"]').onclick=(e)=>{ e.stopPropagation(); saveToPhone(el.dataset.id); };
    });
  }

  // ════ 폰 주소록에 저장 (vCard) ════
  // 브라우저는 주소록에 직접 못 쓰므로, .vcf 파일을 열어 폰이 추가하도록 유도.
  function saveToPhone(id){
    const c=data.contacts.find(x=>x.id===id); if(!c)return;
    const tel=[];
    if(c.per) tel.push(`TEL;TYPE=CELL:${c.per}`);
    if(c.ext) tel.push(`TEL;TYPE=WORK:${c.ext}`);
    const org = (c.tags&&c.tags.length)?`ORG:${c.tags.join(" / ")}`:"";
    const note = c.memo?`NOTE:${c.memo.replace(/\n/g," ")}`:"";
    const vcf=["BEGIN:VCARD","VERSION:3.0",`FN:${c.name}`,`N:;${c.name};;;`,org,...tel,note,"END:VCARD"]
      .filter(Boolean).join("\r\n");
    const blob=new Blob([vcf],{type:"text/vcard;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`${c.name}.vcf`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("연락처 파일 생성 → '주소록에 추가'를 누르세요");
  }

  function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function fmtDue(s){try{const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return s;}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  // ════ 할 일 시트 ════
  function openTaskSheet(id){
    editTask=id||null; const t=id?data.tasks.find(x=>x.id===id):null;
    $("taskSheetTitle").textContent=id?"할 일 수정":"새 할 일";
    $("f-title").value=t?t.title:""; $("f-loc").value=t?t.loc:"WARD";
    $("f-proc").value=t?(t.proc||""):""; $("f-due").value=t?(t.due||""):""; $("f-notes").value=t?(t.notes||""):"";
    setCat(t?t.cat:"ROUND");
    openSheet("taskSheet"); setTimeout(()=>$("f-title").focus(),300);
  }
  function setCat(v){ selCat=v; $("f-cat").querySelectorAll("button").forEach(b=>b.className=b.dataset.v===v?"sel-"+v:""); }
  $("f-cat").querySelectorAll("button").forEach(b=>b.onclick=()=>setCat(b.dataset.v));
  $("saveTaskBtn").onclick=()=>{
    const title=$("f-title").value.trim(); if(!title){toast("내용을 입력하세요");$("f-title").focus();return;}
    const d={title,cat:selCat,loc:$("f-loc").value,proc:$("f-proc").value,due:$("f-due").value,notes:$("f-notes").value.trim()};
    if(editTask)Object.assign(data.tasks.find(x=>x.id===editTask),d);
    else data.tasks.push({id:uid(),done:false,...d});
    save();render();closeSheet();toast(editTask?"수정됨":"추가됨");
  };

  // ════ 연락처 시트 ════
  function renderTagPool(){
    $("tagPool").innerHTML=data.tagList.map(t=>
      `<button class="tag-pick ${pickedTags.includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
    $("tagPool").querySelectorAll(".tag-pick").forEach(b=>{
      b.onclick=()=>{const t=b.dataset.t; if(pickedTags.includes(t))pickedTags=pickedTags.filter(x=>x!==t);else pickedTags.push(t); renderTagPool();};
    });
  }
  $("addTagBtn").onclick=()=>{
    const v=$("newTag").value.trim(); if(!v)return;
    if(!data.tagList.includes(v))data.tagList.push(v);
    if(!pickedTags.includes(v))pickedTags.push(v);
    $("newTag").value=""; save(); renderTagPool();
  };
  $("c-oncall").onclick=()=>{ oncallOn=!oncallOn; $("c-oncall").classList.toggle("on",oncallOn); };

  function openContactSheet(id){
    editContact=id||null; const c=id?data.contacts.find(x=>x.id===id):null;
    $("contactSheetTitle").textContent=id?"연락처 수정":"새 연락처";
    $("c-name").value=c?c.name:""; $("c-ext").value=c?(c.ext||""):""; $("c-per").value=c?(c.per||""):"";
    $("c-memo").value=c?(c.memo||""):"";
    pickedTags=c?[...(c.tags||[])]:[]; oncallOn=c?!!c.oncall:false;
    $("c-oncall").classList.toggle("on",oncallOn);
    renderTagPool();
    openSheet("contactSheet"); setTimeout(()=>$("c-name").focus(),300);
  }
  $("saveContactBtn").onclick=()=>{
    const name=$("c-name").value.trim(); if(!name){toast("이름을 입력하세요");$("c-name").focus();return;}
    const ext=$("c-ext").value.trim(), per=$("c-per").value.trim();
    if(!ext&&!per){ if(!confirm("전화번호가 없습니다. 그래도 저장할까요?"))return; }
    const d={name,ext,per,tags:[...pickedTags],oncall:oncallOn,memo:$("c-memo").value.trim()};
    if(editContact)Object.assign(data.contacts.find(x=>x.id===editContact),d);

  // ════ 토스트 ════

  // ════ 응급실 현황 (E-Gen) ════
  // 인증키: 공공데이터포털 발급 (Decoding 키). 앱에 내장 — 1인 비공개 앱이므로 허용.
  const EGEN_KEY = "11edf49dfafc0f1b9c8342d17ceda4bdc9f1e42f9b526c5f3980fa532324d0a9";
  const EGEN_BASE = "apis.data.go.kr/B552657/ErmctInfoInqireService";
  // 신촌세브란스 (서울특별시 서대문구). 응답의 dutyName 으로 식별.
  const TARGET = { stage1:"서울특별시", stage2:"서대문구", match:"세브란스" };
  // 중증질환 수용 라벨 매핑 (대표 코드 — 실제 응답 키에 맞춰 자동 표기)
  const SEVERE_LABEL = {
    MKioskTy1:"재관류(심근경색·PCI)", MKioskTy2:"뇌경색 재관류", MKioskTy3:"뇌출혈수술",
    MKioskTy4:"대동맥응급", MKioskTy5:"담낭담관질환", MKioskTy6:"복부응급수술",
    MKioskTy7:"장중첩·폐색", MKioskTy8:"응급내시경", MKioskTy9:"응급투석",
    MKioskTy10:"정신과적응급", MKioskTy11:"신생아", MKioskTy28:"중증화상"
  };
  const BED_LABEL = {
    hvec:"응급실 일반", hv27:"코호트 격리", hvs01:"내과중환자실",
    hvcc:"신경과 중환자실", hvncc:"신생아 중환자실", hvgc:"입원실(일반)", hvoc:"수술실"
  };

  let erState = { loading:false, data:null, error:null, cachedAt:null };

  // http(평문) API를 https PWA에서 부르면 차단되므로, 프록시 경유.
  // 여러 프록시를 순서대로 시도 — 하나가 죽어도 다음으로 넘어감.
  const PROXIES = [
    raw => "https://api.allorigins.win/raw?url=" + encodeURIComponent(raw),
    raw => "https://corsproxy.io/?url=" + encodeURIComponent(raw),
    raw => "https://thingproxy.freeboard.io/fetch/" + raw,
  ];
  function rawUrl(op){
    return `http://${EGEN_BASE}/${op}?serviceKey=${EGEN_KEY}&STAGE1=${encodeURIComponent(TARGET.stage1)}&STAGE2=${encodeURIComponent(TARGET.stage2)}&pageNo=1&numOfRows=20&_type=json`;
  }

  // 진단 로그 (실패 시 화면에 표시)
  let erDiag = [];

  async function egenFetch(op){
    const raw = rawUrl(op);
    const onHttps = location.protocol === "https:";
    // 시도 순서: http/file이면 직접 먼저, 그다음 프록시들. https면 프록시만.
    const attempts = [];
    if(!onHttps) attempts.push({name:"직접", url:raw});
    PROXIES.forEach((p,i)=>attempts.push({name:"프록시"+(i+1), url:p(raw)}));

    let lastErr;
    for(const a of attempts){
      try{
        const res = await fetch(a.url, { cache:"no-store" });
        const text = await res.text();
        if(!res.ok){ erDiag.push(`[${op}] ${a.name}: HTTP ${res.status} / ${text.slice(0,120)}`); lastErr=new Error("HTTP "+res.status); continue; }
        // JSON 파싱 시도
        let json;
        try{ json = JSON.parse(text); }
        catch(pe){
          // XML 에러응답(키 오류 등)이면 메시지 추출
          const m = text.match(/<returnAuthMsg>([^<]*)<\/returnAuthMsg>/) || text.match(/<errMsg>([^<]*)<\/errMsg>/) || text.match(/<resultMsg>([^<]*)<\/resultMsg>/);
          erDiag.push(`[${op}] ${a.name}: JSON아님 / ${ (m?m[1]:text.slice(0,140)) }`);
          lastErr = new Error(m ? m[1] : "응답이 JSON이 아님(키/신청 확인)");
          continue;
        }
        // 정상 JSON이지만 API 헤더가 에러일 수도
        const h = json?.response?.header;
        if(h && h.resultCode && h.resultCode!=="00"){
          erDiag.push(`[${op}] ${a.name}: API코드 ${h.resultCode} / ${h.resultMsg||""}`);
          lastErr = new Error(`${h.resultMsg||"API오류"} (코드 ${h.resultCode})`);
          // 키/신청 문제는 프록시 바꿔도 동일 → 즉시 중단
          throw lastErr;
        }
        erDiag.push(`[${op}] ${a.name}: 성공`);
        return json;
      }catch(e){
        lastErr = e;
        erDiag.push(`[${op}] ${a.name}: ${e.message||e}`);
        // API 키/신청 오류는 모든 경로에서 동일하므로 더 시도 안 함
        if(/코드 (3|2)\d/.test(e.message||"")) break;
      }
    }
    throw lastErr || new Error("조회 실패");
  }

  function pickItems(json){
    const h = json?.response?.header;
    if(h && h.resultCode && h.resultCode!=="00") throw new Error(h.resultMsg||("코드 "+h.resultCode));
    let item = json?.response?.body?.items?.item;
    if(!item) return [];
    return Array.isArray(item)?item:[item];
  }
  function findTarget(items){ return items.find(x=>(x.dutyName||"").includes(TARGET.match)) || null; }

  async function loadER(){
    erState.loading=true; erState.error=null; erDiag=[]; renderER();
    try{
      const [bedsJson, sevJson] = await Promise.all([
        egenFetch("getEmrrmRltmUsefulSckbdInfoInqire"),
        egenFetch("getSrsillDissAceptncPosblInfoInqire")
      ]);
      const beds = findTarget(pickItems(bedsJson));
      const sev  = findTarget(pickItems(sevJson));
      if(!beds && !sev) throw new Error("신촌세브란스를 응답에서 찾지 못했습니다");
      erState.data = { beds, sev, fetchedAt: Date.now() };
      try{ localStorage.setItem("cardioApp.er", JSON.stringify(erState.data)); }catch(e){}
    }catch(e){
      erState.error = e.message || String(e);
      // 실패 시 캐시 폴백
      try{ const c=JSON.parse(localStorage.getItem("cardioApp.er")); if(c){erState.data=c; erState.cachedAt=c.fetchedAt;} }catch(_){}
    }finally{
      erState.loading=false; renderER();
    }
  }

  function num(v){ const n=parseInt(v,10); return Number.isNaN(n)?null:n; }
  function fmtTs(ts){ if(!ts)return""; const d=new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  function fmtEgenTime(s){ // YYYYMMDDHHMMSS
    if(!s||s.length<12) return s||"";
    return `${s.slice(4,6)}/${s.slice(6,8)} ${s.slice(8,10)}:${s.slice(10,12)}`;
  }

  function renderER(){
    const el = $("erContent");
    if(erState.loading){
      el.innerHTML = `<div class="er-state"><div class="big">🚑</div>신촌세브란스 응급실 현황을<br>불러오는 중입니다…</div>`;
      return;
    }
    if(!erState.data && erState.error){
      const diag = erDiag.length ? `<div class="er-setup" style="font-family:monospace;white-space:pre-wrap;word-break:break-all">진단 로그:\n${esc(erDiag.join("\n"))}</div>` : "";
      el.innerHTML = `<div class="er-state"><div class="big">⚠️</div>조회에 실패했습니다.<br><span style="font-size:12px">${esc(erState.error)}</span></div>
        <button class="er-refresh" id="erRefresh">다시 시도</button>
        ${diag}
        <div class="er-setup">자가 점검: ① 인터넷 연결 ② 공공데이터포털 활용신청(서비스ID 15000563) 승인 여부 ③ 키가 'Decoding' 키인지. 위 진단 로그를 캡처해 보여주시면 정확히 진단해 드립니다.</div>`;
      $("erRefresh").onclick=loadER; return;
    }
    if(!erState.data){
      el.innerHTML = `<div class="er-state"><div class="big">🚑</div>아래 버튼을 눌러<br>신촌세브란스 응급실 현황을 조회하세요.</div>
        <button class="er-refresh" id="erRefresh">현황 조회</button>`;
      $("erRefresh").onclick=loadER; return;
    }

    const { beds, sev, fetchedAt } = erState.data;
    let html = "";
    if(erState.error){ html += `<div class="er-cached">⚠️ 최신 조회 실패 — ${fmtTs(fetchedAt)} 기준 마지막 정보입니다</div>`; }

    // 가용병상 카드
    if(beds){
      let bedHtml = "";
      for(const [k,label] of Object.entries(BED_LABEL)){
        const v = num(beds[k]);
        if(v===null) continue;
        const cls = v<=0 ? "full" : "ok";
        bedHtml += `<div class="bed ${cls}"><div class="lbl">${label}</div><div class="val">${v}</div></div>`;
      }
      html += `<div class="er-card">
        <div class="er-name">${esc(beds.dutyName||"신촌세브란스")}</div>
        <div class="er-time">업데이트 ${fmtEgenTime(beds.hvidate)} · 조회 ${fmtTs(fetchedAt)}</div>
        <div class="er-beds">${bedHtml||'<div class="er-state" style="grid-column:1/3;padding:14px">병상 정보 없음</div>'}</div>
      </div>`;
    }

    // 중증질환 수용 가능/불가
    if(sev){
      const rows = [];
      for(const [k,label] of Object.entries(SEVERE_LABEL)){
        const v = sev[k];
        if(v==null) continue;
        const yes = String(v).toUpperCase()==="Y";
        rows.push(`<div class="accept ${yes?'yes':'no'}"><span class="dot"></span>
          <span class="a-lbl">${label}</span><span class="a-st">${yes?'가능':'불가'}</span></div>`);
      }
      const unavailable = rows.length;
      if(rows.length){
        html += `<div class="sec-title">중증질환 수용 가능 / 불가</div>${rows.join("")}`;
      }
    }

    // 메시지 (병원이 올린 차단·불가 공지) — 가용병상 응답의 메시지 필드 활용
    const msg = beds && (beds.symBlkMsg || beds.symBlkMsgType);
    if(msg){ html = `<div class="er-msg">📢 ${esc(msg)}</div>` + html; }

    html += `<button class="er-refresh" id="erRefresh">🔄 새로고침</button>`;
    el.innerHTML = html;
    $("erRefresh").onclick=loadER;
  }

  // ════ 자료함 (사진 + OCR, IndexedDB 저장) ════
  // 사진은 용량이 커서 localStorage 대신 IndexedDB에 보관.
  const VDB = { db:null };
  function vaultOpen(){
    return new Promise((res,rej)=>{
      if(VDB.db) return res(VDB.db);
      const r = indexedDB.open("cardioVault", 1);
      r.onupgradeneeded = (e)=>{ const db=e.target.result;
        if(!db.objectStoreNames.contains("items")) db.createObjectStore("items",{keyPath:"id"}); };
      r.onsuccess = ()=>{ VDB.db=r.result; res(VDB.db); };
      r.onerror = ()=>rej(r.error);
    });
  }
  function vaultPut(item){ return vaultOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction("items","readwrite"); tx.objectStore("items").put(item);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
  function vaultAll(){ return vaultOpen().then(db=>new Promise((res,rej)=>{
    const out=[]; const cur=db.transaction("items").objectStore("items").openCursor();
    cur.onsuccess=(e)=>{ const c=e.target.result; if(c){out.push(c.value);c.continue();}else res(out);};
    cur.onerror=()=>rej(cur.error); })); }
  function vaultDelete(id){ return vaultOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction("items","readwrite"); tx.objectStore("items").delete(id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
  function vaultGet(id){ return vaultOpen().then(db=>new Promise((res,rej)=>{
    const rq=db.transaction("items").objectStore("items").get(id);
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }

  let vaultItems = [];   // 메모리 캐시 (이미지 dataURL 포함)
  let vaultQ = "";

  // 이미지 압축: 긴 변 1600px, JPEG 품질 0.7
  function compressImage(file){
    return new Promise((res,rej)=>{
      const img=new Image(); const url=URL.createObjectURL(file);
      img.onload=()=>{
        const MAX=1600; let {width:w,height:h}=img;
        if(w>h && w>MAX){ h=h*MAX/w; w=MAX; } else if(h>MAX){ w=w*MAX/h; h=MAX; }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(cv.toDataURL("image/jpeg",0.7));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("이미지 로드 실패"));};
      img.src=url;
    });
  }

  // 파일 선택 → 압축 → 저장
  $("vaultInput").onchange=async(e)=>{
    const file=e.target.files[0]; e.target.value=""; if(!file)return;
    toast("이미지 처리 중…");
    try{
      const dataUrl=await compressImage(file);
      const title=prompt("자료 제목 (예: 12/3 당직표, 협진 공문)","") || "제목 없음";
      const item={ id:uid(), title, img:dataUrl, text:"", createdAt:Date.now() };
      await vaultPut(item);
      vaultItems.unshift(item);
      renderVault();
      toast("저장됨 · 문자인식을 원하면 'OCR' 누르세요");
    }catch(err){ toast("저장 실패: "+(err.message||err)); }
  };

  // OCR — Tesseract.js를 필요할 때 1회 로드 (인터넷 필요)
  let tesseractLoading=null;
  function loadTesseract(){
    if(window.Tesseract) return Promise.resolve();
    if(tesseractLoading) return tesseractLoading;
    tesseractLoading=new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload=()=>res(); s.onerror=()=>rej(new Error("OCR 엔진 로드 실패(인터넷 필요)"));
      document.head.appendChild(s);
    });
    return tesseractLoading;
  }
  async function runOCR(id){
    const item=vaultItems.find(x=>x.id===id); if(!item)return;
    const btn=document.querySelector(`[data-ocr="${id}"]`);
    if(btn){ btn.disabled=true; btn.textContent="인식 중…"; }
    try{
      if(!navigator.onLine) throw new Error("오프라인에서는 문자인식 불가");
      await loadTesseract();
      const { data } = await window.Tesseract.recognize(item.img, "kor+eng");
      item.text=(data.text||"").trim();
      await vaultPut(item);
      renderVault();
      toast(item.text? "문자인식 완료 (검색 가능)" : "글자를 찾지 못했습니다");
    }catch(err){
      toast(err.message||"문자인식 실패");
      if(btn){ btn.disabled=false; btn.textContent="🔤 OCR"; }
    }
  }

  // 공유/내보내기 — Web Share(파일) 지원 시 시트, 아니면 다운로드
  async function shareItem(id){
    const item=vaultItems.find(x=>x.id===id); if(!item)return;
    try{
      const blob=await (await fetch(item.img)).blob();
      const file=new File([blob], (item.title||"자료")+".jpg", {type:"image/jpeg"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:item.title||"자료", text:item.text||"" });
        return;
      }
    }catch(e){ if(e&&e.name==="AbortError") return; }
    // 폴백: 다운로드 (구글드라이브 등에 직접 올리기)
    const a=document.createElement("a"); a.href=item.img; a.download=(item.title||"자료")+".jpg";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("이미지 저장됨 → 구글드라이브 등에 올리세요");
  }

  function renderVault(){
    const el=$("vaultList");
    // 최초 진입 시 IndexedDB에서 로드
    if(!vaultItems.length && !el.dataset.loaded){
      el.innerHTML=`<div class="v-empty"><div class="big">🗂️</div>불러오는 중…</div>`;
      vaultAll().then(items=>{
        vaultItems=items.sort((a,b)=>b.createdAt-a.createdAt);
        el.dataset.loaded="1"; renderVault();
      }).catch(()=>{ el.innerHTML=`<div class="v-empty">저장소를 열 수 없습니다</div>`; });
      return;
    }
    el.dataset.loaded="1";
    let items=vaultItems.slice();
    if(vaultQ){ const q=vaultQ.toLowerCase();
      items=items.filter(it=>(it.title||"").toLowerCase().includes(q)||(it.text||"").toLowerCase().includes(q)); }

    const searchBox=`<input type="text" class="v-search" id="vSearch" placeholder="🔍 제목·인식된 글자로 검색" value="${esc(vaultQ)}">`;
    const note=`<div class="v-note">💡 사진은 자동 압축되어 앱에 저장됩니다. 환자 식별정보(이름·등록번호)는 가린 뒤 올리세요. 용량이 쌓이면 '공유'로 구글드라이브에 백업하세요.</div>`;

    if(!items.length){
      el.innerHTML=searchBox+note+`<div class="v-empty"><div class="big">🗂️</div>${vaultQ?"검색 결과가 없습니다.":"저장된 자료가 없습니다.<br>아래 '＋ 자료'로 캡처를 올리세요."}</div>`;
      wireSearch(); return;
    }
    el.innerHTML=searchBox+note+items.map(it=>{
      const hasText=it.text&&it.text.length;
      const textBlock=hasText?`<div class="v-text" data-exp="${it.id}">${esc(it.text)}</div>`:"";
      const ocrLabel=hasText?"🔤 재인식":"🔤 OCR";
      return `<div class="v-item">
        <img class="v-thumb" src="${it.img}" data-view="${it.id}" alt="${esc(it.title)}">
        <div class="v-info">
          <div class="v-title">${esc(it.title)}</div>
          <div class="v-date">${fmtTs(it.createdAt)}${hasText?" · 🔤 검색가능":""}</div>
          ${textBlock}
          <div class="v-actions">
            <button class="v-btn ocr" data-ocr="${it.id}">${ocrLabel}</button>
            <button class="v-btn share" data-share="${it.id}">📤 공유</button>
            <button class="v-btn del" data-del="${it.id}">🗑 삭제</button>
          </div>
        </div></div>`;
    }).join("");
    // 이벤트 연결
    el.querySelectorAll("[data-view]").forEach(im=>im.onclick=()=>openViewer(im.dataset.view));
    el.querySelectorAll("[data-ocr]").forEach(b=>b.onclick=()=>runOCR(b.dataset.ocr));
    el.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareItem(b.dataset.share));
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delVaultItem(b.dataset.del));
    el.querySelectorAll("[data-exp]").forEach(t=>t.onclick=()=>t.classList.toggle("expanded"));
    wireSearch();
  }
  function wireSearch(){ const s=$("vSearch"); if(s){ s.oninput=(e)=>{ vaultQ=e.target.value.trim(); const pos=e.target.selectionStart; renderVault(); const ns=$("vSearch"); if(ns){ns.focus(); try{ns.setSelectionRange(pos,pos);}catch(_){}}}; } }
  function delVaultItem(id){ if(!confirm("이 자료를 삭제할까요?"))return;
    vaultDelete(id).then(()=>{ vaultItems=vaultItems.filter(x=>x.id!==id); renderVault(); toast("삭제됨"); }); }

  // 이미지 확대 뷰어
  function openViewer(id){ const it=vaultItems.find(x=>x.id===id); if(!it)return;
    $("vViewerImg").src=it.img; $("vViewer").classList.add("open"); }
  $("vClose").onclick=()=>$("vViewer").classList.remove("open");
  $("vViewer").onclick=(e)=>{ if(e.target===$("vViewer"))$("vViewer").classList.remove("open"); };

  // 초기
  renderFilters(); render();
})();
</script>
</body>
</html>
